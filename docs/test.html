<h2>Metadata Test Page</h2>
<p>This page tests if metadata is loading correctly.</p>

<div>
    <strong>Total matches:</strong> <span id="total-matches">Loading...</span>
</div>

<div>
    <strong>Metadata raw:</strong> <pre id="metadata-raw">Loading...</pre>
</div>

<script>
async function testMetadata() {
    try {
        console.log('Testing metadata loading...');
        const response = await fetch('data/metadata.json');
        console.log('Response status:', response.status);
        
        if (response.ok) {
            const metadata = await response.json();
            console.log('Metadata loaded:', metadata);
            
            // Show raw metadata
            document.getElementById('metadata-raw').textContent = JSON.stringify(metadata, null, 2);
            
            // Update match count
            const totalMatchesElement = document.getElementById('total-matches');
            if (totalMatchesElement && metadata.match_statistics) {
                const matchCount = metadata.match_statistics.matches_with_handgun_data;
                totalMatchesElement.textContent = matchCount.toLocaleString();
                console.log('Set match count to:', matchCount);
            } else {
                console.error('Element or stats missing');
                totalMatchesElement.textContent = 'ERROR: Missing data';
            }
        } else {
            console.error('Failed to load metadata, status:', response.status);
            document.getElementById('total-matches').textContent = 'ERROR: HTTP ' + response.status;
            document.getElementById('metadata-raw').textContent = 'Failed to load';
        }
    } catch (error) {
        console.error('Metadata loading error:', error);
        document.getElementById('total-matches').textContent = 'ERROR: ' + error.message;
        document.getElementById('metadata-raw').textContent = 'Error: ' + error.message;
    }
}

// Run test when page loads
document.addEventListener('DOMContentLoaded', testMetadata);
</script>
